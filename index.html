    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #111827;
            --bg-card: #1f2937;
            --bg-card-hover: #374151;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border: #374151;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        header {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 40;
            padding: 16px 24px;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-badge {
            background: var(--accent-gradient);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .logo-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .logo-subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .stats-badge {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #c7d2fe;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 500;
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 24px auto;
            padding: 0 24px;
        }

        /* Controls Bar */
        .controls-bar {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 240px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        select {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            min-width: 160px;
        }

        select:focus {
            border-color: var(--accent);
        }

        .btn-reset {
            padding: 10px 16px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        /* Video Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .video-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .video-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.15);
        }

        .thumb-preview {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .thumb-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .play-overlay {
            position: absolute;
            width: 48px;
            height: 48px;
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            transition: transform 0.2s, background 0.2s;
        }

        .video-card:hover .play-overlay {
            transform: scale(1.15);
            background: var(--accent);
            border-color: var(--accent);
        }

        .card-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .tag-folder {
            background: rgba(255, 255, 255, 0.08);
            padding: 3px 8px;
            border-radius: 4px;
            font-family: monospace;
            color: #e0e7ff;
        }

        .tag-size {
            color: #9ca3af;
        }

        /* Pagination / Load More */
        .load-more-wrap {
            display: flex;
            justify-content: center;
            margin-top: 32px;
        }

        .btn-load-more {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-load-more:hover {
            background: var(--accent-hover);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 64px 16px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        /* Modal Player */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 1000px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        .modal-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .modal-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: white;
        }

        .modal-video-box {
            position: relative;
            background: #000;
            aspect-ratio: 16 / 9;
            width: 100%;
            max-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .modal-video-box video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            max-height: 70vh;
            object-fit: contain;
            outline: none;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.12s ease-in-out;
        }

        .modal-video-box video.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 2;
        }

        .modal-video-box video.standby {
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }

        .modal-footer {
            padding: 14px 20px;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-nav {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent);
            border-color: var(--accent);
        }

        .btn-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .modal-options {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }

        .modal-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .btn-raw {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .btn-raw:hover {
            color: white;
            border-color: var(--text-primary);
        }

        .btn-fs-icon {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.15rem;
            cursor: pointer;
            line-height: 1;
            padding: 4px 6px;
            border-radius: 6px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-fs-icon:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-fullscreen-footer {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid var(--accent);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-fullscreen-footer:hover {
            background: var(--accent);
            color: white;
        }

        /* Toast Notification */
        .player-toast {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(15, 23, 42, 0.95);
            color: #f1f5f9;
            padding: 8px 20px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            z-index: 200;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            white-space: nowrap;
        }

        .player-toast.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Unified Fullscreen Mode & Pseudo-Fullscreen for Mobile (iOS Safari & Android) */
        .modal-content:fullscreen,
        .modal-content:-webkit-full-screen,
        .modal-content.is-fullscreen {
            width: 100vw !important;
            max-width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            max-height: 100vh !important;
            max-height: 100dvh !important;
            border-radius: 0 !important;
            border: none !important;
            background: #000 !important;
            box-shadow: none !important;
            display: block !important;
            position: fixed !important;
            inset: 0 !important;
            overflow: hidden !important;
            margin: 0 !important;
            padding: 0 !important;
            z-index: 9999 !important;
        }

        /* Video box occupies 100% of entire viewport */
        .modal-content:fullscreen .modal-video-box,
        .modal-content:-webkit-full-screen .modal-video-box,
        .modal-content.is-fullscreen .modal-video-box {
            position: absolute !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100% !important;
            height: 100dvh !important;
            max-height: 100dvh !important;
            aspect-ratio: auto !important;
            background: #000 !important;
            margin: 0 !important;
            padding: 0 !important;
            z-index: 1 !important;
        }

        .modal-content:fullscreen .modal-video-box video,
        .modal-content:-webkit-full-screen .modal-video-box video,
        .modal-content.is-fullscreen .modal-video-box video {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            max-height: 100% !important;
            object-fit: contain !important;
            background: #000 !important;
        }

        /* Suppress native media player control bar flash in Fullscreen & Clean mode */
        .modal-content:fullscreen video::-webkit-media-controls,
        .modal-content:-webkit-full-screen video::-webkit-media-controls,
        .modal-content.is-fullscreen video::-webkit-media-controls,
        .modal-content:fullscreen video::-webkit-media-controls-enclosure,
        .modal-content:-webkit-full-screen video::-webkit-media-controls-enclosure,
        .modal-content.is-fullscreen video::-webkit-media-controls-enclosure,
        .modal-content:fullscreen video::-webkit-media-controls-panel,
        .modal-content:-webkit-full-screen video::-webkit-media-controls-panel,
        .modal-content.is-fullscreen video::-webkit-media-controls-panel {
            display: none !important;
            -webkit-appearance: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .modal-content:fullscreen video::-moz-media-controls,
        .modal-content.is-fullscreen video::-moz-media-controls {
            display: none !important;
        }

        /* Floating Top Header Overlay */
        .modal-content:fullscreen .player-toast,
        .modal-content:-webkit-full-screen .player-toast,
        .modal-content.is-fullscreen .player-toast {
            display: none !important;
        }

        .modal-content:fullscreen .modal-header,
        .modal-content:-webkit-full-screen .modal-header,
        .modal-content.is-fullscreen .modal-header {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            z-index: 50 !important;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.85) 0%, transparent 100%) !important;
            border: none !important;
            padding: 10px 20px 24px 20px !important;
            transition: opacity 0.15s ease, transform 0.15s ease !important;
            pointer-events: auto;
        }

        /* Floating Bottom Control Capsule Overlay */
        .modal-content:fullscreen .modal-footer,
        .modal-content:-webkit-full-screen .modal-footer,
        .modal-content.is-fullscreen .modal-footer {
            position: absolute !important;
            bottom: 14px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            z-index: 50 !important;
            background: rgba(15, 23, 42, 0.94) !important;
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 50px !important;
            padding: 6px 18px !important;
            gap: 12px !important;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7) !important;
            width: auto !important;
            max-width: 95vw !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            transition: opacity 0.15s ease, transform 0.15s ease !important;
            pointer-events: auto;
        }

        /* Pure Full Video Mode when idle (ZERO UI DISTRACTION) */
        .modal-content.fs-idle:fullscreen,
        .modal-content.fs-idle:-webkit-full-screen,
        .modal-content.fs-idle.is-fullscreen {
            cursor: none !important;
        }

        .modal-content.fs-idle:fullscreen .modal-header,
        .modal-content.fs-idle:-webkit-full-screen .modal-header,
        .modal-content.fs-idle.is-fullscreen .modal-header,
        .modal-content.fs-idle .modal-header {
            opacity: 0 !important;
            transform: translateY(-100%) !important;
            pointer-events: none !important;
        }

        .modal-content.fs-idle:fullscreen .modal-footer,
        .modal-content.fs-idle:-webkit-full-screen .modal-footer,
        .modal-content.fs-idle.is-fullscreen .modal-footer,
        .modal-content.fs-idle .modal-footer {
            opacity: 0 !important;
            transform: translate(-50%, 60px) !important;
            pointer-events: none !important;
        }

        /* Clean Mode (Manual permanent hide UI via 'H' shortcut) */
        .modal-content.fs-clean-mode .modal-header,
        .modal-content.fs-clean-mode .modal-footer {
            opacity: 0 !important;
            pointer-events: none !important;
            display: none !important;
        }

        /* Responsive Mobile Phone Styling (HP) */
        @media (max-width: 768px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
            .controls-bar {
                flex-direction: column;
                align-items: stretch;
            }
            select {
                width: 100%;
            }

            /* Mobile Immersive: In modal on HP, video is always full-screen edge-to-edge */
            .modal {
                padding: 0 !important;
                background: #000 !important;
            }

            .modal-content {
                width: 100vw !important;
                max-width: 100vw !important;
                height: 100% !important;
                height: 100dvh !important;
                max-height: 100dvh !important;
                border-radius: 0 !important;
                border: none !important;
                position: fixed !important;
                inset: 0 !important;
                background: #000 !important;
                box-shadow: none !important;
                display: block !important;
                overflow: hidden !important;
            }

            .modal-video-box {
                position: absolute !important;
                inset: 0 !important;
                width: 100vw !important;
                height: 100% !important;
                height: 100dvh !important;
                max-height: 100dvh !important;
                aspect-ratio: auto !important;
                background: #000 !important;
                margin: 0 !important;
                padding: 0 !important;
                z-index: 1 !important;
            }

            .modal-video-box video {
                position: absolute !important;
                inset: 0 !important;
                width: 100% !important;
                height: 100% !important;
                max-height: 100% !important;
                object-fit: contain !important;
                background: #000 !important;
            }

            .modal-header {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
                z-index: 50 !important;
                background: linear-gradient(180deg, rgba(0, 0, 0, 0.85) 0%, transparent 100%) !important;
                border: none !important;
                padding: 10px 14px 20px 14px !important;
                transition: opacity 0.15s ease, transform 0.15s ease !important;
            }

            .modal-footer {
                position: absolute !important;
                bottom: 12px !important;
                left: 50% !important;
                transform: translateX(-50%) !important;
                z-index: 50 !important;
                background: rgba(15, 23, 42, 0.94) !important;
                backdrop-filter: blur(16px) !important;
                -webkit-backdrop-filter: blur(16px) !important;
                border: 1px solid rgba(255, 255, 255, 0.15) !important;
                border-radius: 24px !important;
                padding: 8px 12px !important;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8) !important;
                width: calc(100% - 24px) !important;
                max-width: 480px !important;
                display: flex !important;
                flex-direction: column !important;
                gap: 8px !important;
                transition: opacity 0.15s ease, transform 0.15s ease !important;
            }

            .nav-buttons {
                width: 100%;
                display: flex;
                justify-content: space-between;
                gap: 6px;
            }

            .nav-buttons .btn-nav {
                flex: 1;
                justify-content: center;
                padding: 6px 8px;
                font-size: 0.8rem;
            }

            .modal-options {
                width: 100%;
                display: flex;
                justify-content: space-around;
                align-items: center;
                gap: 6px;
                font-size: 0.75rem;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo-area">

    <div class="modal" id="videoModal" onclick="onModalBackdropClick(event)">

    <!-- Video Manifest Data File -->
    <script src="videos.js?v=42683_clean"></script>

    <script>
        let allVideos = [];
        let filteredVideos = [];
        let displayedCount = 0;
        const PAGE_SIZE = 36;
        let currentModalIndex = -1;

        // Video URL Resolver (Seamless Multi-Repo Direct Raw URL)
        function getVideoUrl(item) {
            if (!item) return '';
            const path = (typeof item === 'string') ? item : item.p;
            if (!path) return '';

            // Already an absolute HTTP/HTTPS or file:// URL
            if (path.startsWith('http://') || path.startsWith('https://') || path.startsWith('file:///')) {
                return path;
            }

            const rIndex = (typeof item === 'object' && item.r !== undefined) ? item.r : 0;

            let repoInfo = null;
            if (window.SORA_MANIFEST && Array.isArray(window.SORA_MANIFEST.repos) && window.SORA_MANIFEST.repos[rIndex]) {
                repoInfo = window.SORA_MANIFEST.repos[rIndex];
            } else {
                repoInfo = {
                    id: 'sora',
                    name: 'sora',
                    baseUrl: (window.SORA_MANIFEST && window.SORA_MANIFEST.baseUrl) || 'https://raw.githubusercontent.com/RadinX/sora/main/'
                };
            }

            return repoInfo.baseUrl.replace(/\/$/, '') + '/' + path.replace(/^\//, '');
        }

        // Initialize Gallery
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof window.SORA_MANIFEST !== 'undefined' && Array.isArray(window.SORA_MANIFEST.videos)) {
                allVideos = window.SORA_MANIFEST.videos;
                const jumpInp = document.getElementById('jumpInput');
                if (jumpInp) {
                    jumpInp.placeholder = `1-${allVideos.length.toLocaleString()}`;
                    jumpInp.max = allVideos.length;
                }
                const meta = window.SORA_MANIFEST;
                const stats = document.getElementById('statsBadge');
                if (stats && meta.generatedAt) {
                    stats.title = `Mode: ${meta.mode} | Terakhir di-index: ${meta.generatedAt}`;
                }
                populateFolderOptions();
                applyFilters();
            } else {
                document.getElementById('statsBadge').innerText = "Belum ada index videos.js";
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('emptyState').innerHTML = `
                    <div class="empty-icon">⚠️</div>
                    <h3>File videos.js Belum Ditemukan</h3>
                    <p>Jalankan script <code>node reindex.js</code> atau <code>.\\reindex.ps1</code> di terminal untuk membuat indeks video.</p>
                `;
            }
        });

        function getFolderPriority(folderName) {
            const fn = (folderName || '').toLowerCase();
            if (fn === 'luqmanz') return -1;
            if (fn.startsWith('standup') || fn.includes('standup')) return 1;
            return 0;
        }

        function populateFolderOptions() {
            const folderCountMap = new Map();
            allVideos.forEach(v => {
                folderCountMap.set(v.f, (folderCountMap.get(v.f) || 0) + 1);
            });

            const folderSelect = document.getElementById('folderSelect');
            folderSelect.innerHTML = `<option value="">Semua Folder (${folderCountMap.size} kategori)</option>`;

            Array.from(folderCountMap.keys()).sort((a, b) => {
                const prioA = getFolderPriority(a);
                const prioB = getFolderPriority(b);
                if (prioA !== prioB) return prioA - prioB;
                return a.localeCompare(b, undefined, { sensitivity: 'base' });
            }).forEach(f => {
                const opt = document.createElement('option');
                opt.value = f;
                opt.textContent = `${f} (${folderCountMap.get(f).toLocaleString()})`;
                folderSelect.appendChild(opt);
            });
        }

        function onFolderChange() {
            const selectedFolder = document.getElementById('folderSelect').value;
            const subSelect = document.getElementById('subfolderSelect');
            subSelect.innerHTML = '<option value="">Semua Subfolder</option>';

            if (selectedFolder) {
                const subCounts = new Map();
                allVideos.filter(v => v.f === selectedFolder).forEach(v => {
                    if (v.s) {
                        subCounts.set(v.s, (subCounts.get(v.s) || 0) + 1);
                    }
                });

                Array.from(subCounts.keys()).sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' })).forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s;
                    opt.textContent = `${s} (${subCounts.get(s).toLocaleString()})`;
                    subSelect.appendChild(opt);
                });
            }
            onFilterChange();
        }

        function onFilterChange() {
            applyFilters();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('folderSelect').value = '';
            document.getElementById('subfolderSelect').innerHTML = '<option value="">Semua Subfolder</option>';
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const folder = document.getElementById('folderSelect').value;
            const sub = document.getElementById('subfolderSelect').value;

            filteredVideos = allVideos.filter(v => {
                const matchFolder = !folder || v.f === folder;
                const matchSub = !sub || v.s === sub;
                const matchQuery = !query || v.n.toLowerCase().includes(query) || v.p.toLowerCase().includes(query) || v.f.toLowerCase().includes(query);
                return matchFolder && matchSub && matchQuery;
            });

            document.getElementById('statsBadge').innerText = 
                `Menampilkan: ${filteredVideos.length.toLocaleString()} dari ${allVideos.length.toLocaleString()} video`;

            const jumpInput = document.getElementById('jumpInput');
            if (jumpInput) {
                jumpInput.placeholder = `1-${filteredVideos.length.toLocaleString()}`;
                jumpInput.max = filteredVideos.length;
            }

            displayedCount = 0;
            document.getElementById('videoGrid').innerHTML = '';
            renderNextBatch();
        }

        function renderNextBatch() {
            const grid = document.getElementById('videoGrid');
            const nextBatch = filteredVideos.slice(displayedCount, displayedCount + PAGE_SIZE);

            nextBatch.forEach((v, idx) => {
                const actualIndex = displayedCount + idx;
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => openModal(actualIndex);

                const subText = v.s ? ` / ${v.s}` : '';
                card.innerHTML = `
                    <div class="thumb-preview">
                        <video preload="metadata" muted playsinline src="${getVideoUrl(v)}#t=0.5"></video>
                        <div class="play-overlay">▶</div>
                    </div>
                    <div class="card-body">
                        <div class="card-title" title="${v.n}">${v.n}</div>
                        <div class="card-meta">
                            <span class="tag-folder">${v.f}${subText}</span>
                            <span class="tag-size">${v.m} MB</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            displayedCount += nextBatch.length;

            const loadMoreWrap = document.getElementById('loadMoreWrap');
            const emptyState = document.getElementById('emptyState');

            if (filteredVideos.length === 0) {
                emptyState.style.display = 'block';
                loadMoreWrap.style.display = 'none';
            } else {
                emptyState.style.display = 'none';
                loadMoreWrap.style.display = displayedCount < filteredVideos.length ? 'flex' : 'none';
            }
        }

        function loadMore() {
            renderNextBatch();
        }

        // Modal Player Logic with Dual-Buffer Seamless Transition (Eliminates Gray Blink)
        const modal = document.getElementById('videoModal');
        const videoA = document.getElementById('modalVideoA');
        const videoB = document.getElementById('modalVideoB');
        const modalTitle = document.getElementById('modalTitle');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const btnDownload = document.getElementById('btnDownload');
        const autoAdvanceCheck = document.getElementById('autoAdvanceCheck');
        const loopCheck = document.getElementById('loopCheck');

        let activeVideo = videoA;
        let standbyVideo = videoB;
        let autoAdvanceTriggered = false;
        let isTransitioning = false;

        // Intelligent 3-Stage Upcoming Queue System
        // upcomingQueue[0]: Immediate next video (primed in standbyVideo DOM + hardware decoder)
        // upcomingQueue[1]: 2nd next video (buffered in prefetchSlot2 HTTP cache)
        let upcomingQueue = [];
        let playedHistory = [];

        function isShuffleActive() {
            const shuffleCheck = document.getElementById('shuffleModeCheck');
            return !!(shuffleCheck && shuffleCheck.checked);
        }

        function onShuffleToggle() {
            upcomingQueue = [];
            if (modal.classList.contains('active') && currentModalIndex >= 0 && !activeVideo.paused) {
                schedulePrefetch(currentModalIndex);
            }
        }

        // Smart Random Picker avoiding immediate repetitions
        function getNextRandomIndex(excludeIndices = []) {
            if (filteredVideos.length <= 1) return 0;
            const excludeSet = new Set(excludeIndices);

            let candidates = [];
            for (let i = 0; i < filteredVideos.length; i++) {
                if (!excludeSet.has(i)) {
                    candidates.push(i);
                }
            }

            // Fallback if recent history excluded too many videos
            if (candidates.length === 0) {
                const minimalExclude = new Set([currentModalIndex, ...upcomingQueue]);
                for (let i = 0; i < filteredVideos.length; i++) {
                    if (!minimalExclude.has(i)) {
                        candidates.push(i);
                    }
                }
            }

            if (candidates.length === 0) {
                return Math.floor(Math.random() * filteredVideos.length);
            }

            return candidates[Math.floor(Math.random() * candidates.length)];
        }

        // Fill upcoming pipeline queue
        function refillUpcomingQueue(currentIndex) {
            if (filteredVideos.length === 0) {
                upcomingQueue = [];
                return;
            }

            if (isShuffleActive()) {
                // Ensure at least 2 upcoming random videos are queued in advance
                while (upcomingQueue.length < 2) {
                    const excludeList = [currentIndex, ...upcomingQueue, ...playedHistory.slice(-50)];
                    const nextRand = getNextRandomIndex(excludeList);
                    upcomingQueue.push(nextRand);
                }
            } else {
                // Sequential mode: pipeline next 2 videos in list
                upcomingQueue = [];
                if (currentIndex + 1 < filteredVideos.length) {
                    upcomingQueue.push(currentIndex + 1);
                }
                if (currentIndex + 2 < filteredVideos.length) {
                    upcomingQueue.push(currentIndex + 2);
                }
            }
        }

        // Synchronize Volume and Mute across both video elements
        function syncVolume(source, target) {
            if (!source || !target) return;
            target.volume = source.volume;
            target.muted = source.muted;
        }

        videoA.addEventListener('volumechange', () => {
            if (activeVideo === videoA) syncVolume(videoA, videoB);
        });
        videoB.addEventListener('volumechange', () => {
            if (activeVideo === videoB) syncVolume(videoB, videoA);
        });

        function onAutoAdvanceToggle() {
            if (autoAdvanceCheck.checked) {
                loopCheck.checked = false;
                activeVideo.loop = false;
                standbyVideo.loop = false;
            }
        }

        function onLoopToggle() {
            const isLoop = loopCheck.checked;
            if (isLoop) {
                autoAdvanceCheck.checked = false;
            }
            activeVideo.loop = isLoop;
            standbyVideo.loop = isLoop;
        }

        // Secondary background prefetch slot for 2nd next video caching
        const prefetchSlot2 = document.createElement('video');
        prefetchSlot2.preload = 'auto';
        prefetchSlot2.muted = true;
        prefetchSlot2.playsInline = true;

        let prefetchTimer1 = null;
        let prefetchTimer2 = null;

        function cancelPendingPrefetch() {
            if (prefetchTimer1) {
                clearTimeout(prefetchTimer1);
                prefetchTimer1 = null;
            }
            if (prefetchTimer2) {
                clearTimeout(prefetchTimer2);
                prefetchTimer2 = null;
            }
        }

        function clearPrefetch() {
            cancelPendingPrefetch();
            prefetchSlot2.removeAttribute('src');
            prefetchSlot2.removeAttribute('data-path');
            prefetchSlot2.load();
        }

        // Strategic Staged Prefetch:
        // Priority 1: Current video loads and plays with 100% bandwidth.
        // Stage 1: After 800ms of stable active playback, preload next video in standbyVideo.
        // Stage 2: When standby reaches canplay (or after 2s), buffer 2nd next video in prefetchSlot2.
        function schedulePrefetch(currentIndex) {
            cancelPendingPrefetch();
            refillUpcomingQueue(currentIndex);

            // Wait 800ms of active playback so active video buffers comfortably without network contention
            prefetchTimer1 = setTimeout(() => {
                if (!modal.classList.contains('active') || activeVideo.paused) return;

                // Load Slot 1 (Next Video) into standbyVideo in DOM
                if (upcomingQueue.length > 0) {
                    const nextIdx1 = upcomingQueue[0];
                    const next1 = filteredVideos[nextIdx1];
                    if (next1) {
                        const url1 = getVideoUrl(next1);
                        if (standbyVideo.getAttribute('data-index') !== String(nextIdx1) || standbyVideo.getAttribute('data-path') !== next1.p) {
                            standbyVideo.setAttribute('data-index', String(nextIdx1));
                            standbyVideo.setAttribute('data-path', next1.p);
                            standbyVideo.src = url1;
                            standbyVideo.preload = 'auto';
                            standbyVideo.load();
                        }
                    }
                } else {
                    standbyVideo.removeAttribute('src');
                    standbyVideo.removeAttribute('data-index');
                    standbyVideo.removeAttribute('data-path');
                }

                // Stage 2 fallback timer: Start Slot 2 after Slot 1 has had 2000ms to buffer
                prefetchTimer2 = setTimeout(() => {
                    triggerPrefetchSlot2();
                }, 2000);

            }, 800);
        }

        function triggerPrefetchSlot2() {
            if (!modal.classList.contains('active') || activeVideo.paused) return;
            if (upcomingQueue.length > 1) {
                const nextIdx2 = upcomingQueue[1];
                const next2 = filteredVideos[nextIdx2];
                if (next2) {
                    const url2 = getVideoUrl(next2);
                    if (prefetchSlot2.getAttribute('data-path') !== next2.p) {
                        prefetchSlot2.setAttribute('data-path', next2.p);
                        prefetchSlot2.src = url2;
                        prefetchSlot2.load();
                    }
                }
            } else {
                prefetchSlot2.removeAttribute('src');
                prefetchSlot2.removeAttribute('data-path');
            }
        }

        function updateModalUI(index) {
            const v = filteredVideos[index];
            if (!v) return;

            const badge = document.getElementById('modalVideoBadge');
            if (badge) {
                badge.innerText = `#${(index + 1).toLocaleString()} / ${filteredVideos.length.toLocaleString()}`;
            }

            const subText = v.s ? `${v.s}/` : '';
            modalTitle.innerText = `${v.f}/${subText}${v.n} (${v.m} MB)`;
            btnDownload.href = getVideoUrl(v);
            btnDownload.download = v.n;
        }

        function openModal(index) {
            if (index < 0 || index >= filteredVideos.length) return;
            autoAdvanceTriggered = false;
            isTransitioning = false;
            currentModalIndex = index;
            upcomingQueue = [];
            clearPrefetch();
            playedHistory.push(index);
            if (playedHistory.length > 100) playedHistory.shift();

            const v = filteredVideos[index];
            const url = getVideoUrl(v);

            updateModalUI(index);

            // Active player setup: gets 100% bandwidth to start playing immediately!
            const modalContentEl = document.querySelector('.modal-content');
            const isFs = modalContentEl && (document.fullscreenElement === modalContentEl || modalContentEl.classList.contains('is-fullscreen'));
            activeVideo.controls = !isFs;
            standbyVideo.controls = !isFs;
            activeVideo.src = url;
            activeVideo.currentTime = 0;
            activeVideo.loop = loopCheck ? loopCheck.checked : false;
            activeVideo.classList.add('active');
            activeVideo.classList.remove('standby');

            // Standby player reset: DO NOT load anything yet to avoid hanging active video
            standbyVideo.classList.remove('active');
            standbyVideo.classList.add('standby');
            standbyVideo.pause();
            standbyVideo.removeAttribute('src');
            standbyVideo.removeAttribute('data-index');
            standbyVideo.removeAttribute('data-path');

            const playPromise = activeVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(err => console.warn("Autoplay notice:", err));
            }

            updateNavButtons();
            modal.classList.add('active');
            showPlayerUI(1200);

            // Prefetch is triggered during active playback via 'playing' event
        }

        function closeModal() {
            videoA.controls = true;
            videoB.controls = true;
            if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            }
            const modalContent = document.querySelector('.modal-content');
            if (modalContent) {
                modalContent.classList.remove('is-fullscreen');
                modalContent.classList.remove('fs-idle');
                modalContent.classList.remove('fs-clean-mode');
            }
            clearTimeout(fsIdleTimer);
            modal.classList.remove('active');
            videoA.pause();
            videoB.pause();
            videoA.removeAttribute('src');
            videoB.removeAttribute('src');
            videoA.removeAttribute('data-index');
            videoB.removeAttribute('data-index');
            videoA.removeAttribute('data-path');
            videoB.removeAttribute('data-path');
            autoAdvanceTriggered = false;
            isTransitioning = false;
            currentModalIndex = -1;
            upcomingQueue = [];
            clearPrefetch();
        }

        function onModalBackdropClick(event) {
            if (event.target === modal) {
                closeModal();
            }
        }

        function updateNavButtons() {
            btnPrev.disabled = currentModalIndex <= 0;
            btnNext.disabled = !isShuffleActive() && currentModalIndex >= filteredVideos.length - 1;
        }

        // Seamless Transition Engine: switches to new video with ZERO blink
        function switchToVideo(targetIndex) {
            if (targetIndex < 0 || targetIndex >= filteredVideos.length) return;
            if (isTransitioning) return;
            isTransitioning = true;
            autoAdvanceTriggered = false;

            const targetData = filteredVideos[targetIndex];
            const targetUrl = getVideoUrl(targetData);

            // Check if standbyVideo already has this target preloaded and ready
            const isStandbyPreloaded = (standbyVideo.getAttribute('data-index') === String(targetIndex)) &&
                                       (standbyVideo.readyState >= 2);

            const performSwap = () => {
                syncVolume(activeVideo, standbyVideo);
                standbyVideo.loop = loopCheck ? loopCheck.checked : false;

                const modalContentEl = document.querySelector('.modal-content');
                const isFs = modalContentEl && (document.fullscreenElement === modalContentEl || modalContentEl.classList.contains('is-fullscreen'));
                standbyVideo.controls = !isFs;
                activeVideo.controls = !isFs;

                const playPromise = standbyVideo.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => console.warn("Autoplay notice:", e));
                }

                // Smooth crossfade: reveal standby, hide active
                standbyVideo.classList.add('active');
                standbyVideo.classList.remove('standby');
                activeVideo.classList.remove('active');
                activeVideo.classList.add('standby');

                // Keep outgoing video stable while crossfade completes, then pause & clean
                setTimeout(() => {
                    activeVideo.pause();
                    activeVideo.currentTime = 0;
                    activeVideo.removeAttribute('src');
                    activeVideo.removeAttribute('data-index');
                    activeVideo.removeAttribute('data-path');

                    // Swap player roles
                    const temp = activeVideo;
                    activeVideo = standbyVideo;
                    standbyVideo = temp;

                    currentModalIndex = targetIndex;
                    playedHistory.push(targetIndex);
                    if (playedHistory.length > 100) playedHistory.shift();

                    updateModalUI(targetIndex);
                    updateNavButtons();
                    schedulePrefetch(targetIndex);
                    isTransitioning = false;

                    // Keep UI hidden so auto-advancing 5-8s videos are never covered on PC or HP
                    hidePlayerUI();
                }, 130);
            };

            if (isStandbyPreloaded) {
                performSwap();
            } else {
                // If target video is not in standbyVideo yet (e.g. manual Prev / Jump)
                standbyVideo.setAttribute('data-index', String(targetIndex));
                standbyVideo.setAttribute('data-path', targetData.p);
                standbyVideo.src = targetUrl;
                standbyVideo.preload = 'auto';
                standbyVideo.load();

                let readyFired = false;
                const onReady = () => {
                    if (readyFired) return;
                    readyFired = true;
                    standbyVideo.removeEventListener('loadeddata', onReady);
                    standbyVideo.removeEventListener('canplay', onReady);
                    clearTimeout(safetyTimer);
                    performSwap();
                };

                const safetyTimer = setTimeout(onReady, 250);
                standbyVideo.addEventListener('loadeddata', onReady, { once: true });
                standbyVideo.addEventListener('canplay', onReady, { once: true });
            }
        }

        function navigateVideo(direction) {
            if (direction === 1 && isShuffleActive()) {
                triggerNextVideo();
                return;
            }
            const newIndex = currentModalIndex + direction;
            if (newIndex >= 0 && newIndex < filteredVideos.length) {
                upcomingQueue = [];
                switchToVideo(newIndex);
            }
        }

        // Play Random Video from current filtered list
        function playRandomVideo() {
            if (filteredVideos.length === 0) return;

            if (!modal.classList.contains('active')) {
                const randomIdx = Math.floor(Math.random() * filteredVideos.length);
                openModal(randomIdx);
                return;
            }

            // If already in shuffle mode, take the preloaded random video for instant zero-lag switch!
            if (isShuffleActive() && upcomingQueue.length > 0) {
                const targetIdx = upcomingQueue.shift();
                switchToVideo(targetIdx);
            } else {
                const randomIdx = getNextRandomIndex([currentModalIndex]);
                upcomingQueue = [];
                switchToVideo(randomIdx);
            }
        }

        // Jump to specific video number (1-based index)
        function jumpToVideoNumber() {
            const jumpInput = document.getElementById('jumpInput');
            const val = parseInt(jumpInput.value, 10);
            if (isNaN(val) || val < 1 || val > filteredVideos.length) {
                alert(`Silakan masukkan nomor antara 1 dan ${filteredVideos.length.toLocaleString()}`);
                return;
            }
            const targetIdx = val - 1;
            upcomingQueue = [];
            if (!modal.classList.contains('active')) {
                openModal(targetIdx);
            } else {
                switchToVideo(targetIdx);
            }
            jumpInput.blur();
        }

        function triggerNextVideo() {
            if (!autoAdvanceCheck.checked) return;
            if (autoAdvanceTriggered || isTransitioning) return;
            autoAdvanceTriggered = true;

            // In either shuffle or sequential mode, consume from preloaded upcomingQueue!
            if (upcomingQueue.length > 0) {
                const targetIndex = upcomingQueue.shift();
                switchToVideo(targetIndex);
            } else {
                if (!isShuffleActive() && currentModalIndex < filteredVideos.length - 1) {
                    switchToVideo(currentModalIndex + 1);
                }
            }
        }

        // Event listeners for both players
        function onPlayerPlaying(e) {
            if (e.target !== activeVideo) return;
            // Active video is now actively streaming and playing! Start staged prefetch
            schedulePrefetch(currentModalIndex);
        }

        function onStandbyCanPlay(e) {
            if (e.target !== standbyVideo) return;
            // Standby video buffered enough data! Advance to Slot 2 early
            if (prefetchTimer2) {
                clearTimeout(prefetchTimer2);
                prefetchTimer2 = null;
                triggerPrefetchSlot2();
            }
        }

        function onPlayerEnded(e) {
            if (e.target !== activeVideo) return;
            triggerNextVideo();
        }

        function onPlayerTimeUpdate(e) {
            if (e.target !== activeVideo) return;
            if (autoAdvanceCheck.checked && !activeVideo.paused && activeVideo.duration > 0) {
                // Sora audioless videos can stall in Chromium at very end; trigger 0.08s before end
                if (activeVideo.currentTime >= activeVideo.duration - 0.08) {
                    triggerNextVideo();
                }
            }
        }

        videoA.addEventListener('playing', onPlayerPlaying);
        videoB.addEventListener('playing', onPlayerPlaying);
        videoA.addEventListener('canplay', onStandbyCanPlay);
        videoB.addEventListener('canplay', onStandbyCanPlay);
        videoA.addEventListener('ended', onPlayerEnded);
        videoB.addEventListener('ended', onPlayerEnded);
        videoA.addEventListener('timeupdate', onPlayerTimeUpdate);
        videoB.addEventListener('timeupdate', onPlayerTimeUpdate);

        // Unified UI Auto-Hide Engine (Responsive for PC & HP)
        let fsIdleTimer = null;
        let isFsCleanMode = false;

        function hidePlayerUI() {
            const modalContent = document.querySelector('.modal-content');
            if (modalContent) {
                clearTimeout(fsIdleTimer);
                modalContent.classList.add('fs-idle');
            }
        }

        function showPlayerUI(delay = 800) {
            const modalContent = document.querySelector('.modal-content');
            if (!modalContent) return;
            if (isFsCleanMode) {
                modalContent.classList.add('fs-idle');
                return;
            }
            modalContent.classList.remove('fs-idle');
            clearTimeout(fsIdleTimer);
            fsIdleTimer = setTimeout(() => {
                modalContent.classList.add('fs-idle');
            }, delay);
        }

        function togglePlayerUI() {
            const modalContent = document.querySelector('.modal-content');
            if (!modalContent) return;
            if (modalContent.classList.contains('fs-idle')) {
                showPlayerUI(2500);
            } else {
                hidePlayerUI();
            }
        }

        function toggleFsCleanMode() {
            const modalContent = document.querySelector('.modal-content');
            isFsCleanMode = !isFsCleanMode;
            modalContent.classList.toggle('fs-clean-mode', isFsCleanMode);
            const btn = document.getElementById('btnToggleUi');
            if (btn) {
                btn.innerHTML = isFsCleanMode ? '🙈' : '👁️';
                btn.title = isFsCleanMode ? 'Tampilkan Kontrol UI (Shortcut: H)' : 'Sembunyikan UI Total (Shortcut: H)';
            }
            if (isFsCleanMode) {
                hidePlayerUI();
            } else {
                showPlayerUI(1500);
            }
        }

        const modalContentEl = document.querySelector('.modal-content');
        modalContentEl.addEventListener('mousemove', () => showPlayerUI(600));
        modalContentEl.addEventListener('mouseleave', () => hidePlayerUI());

        const modalVideoBox = document.querySelector('.modal-video-box');
        modalVideoBox.addEventListener('click', (e) => {
            if (e.target.closest('button, input, select, a, label')) return;
            togglePlayerUI();
        });

        const modalHeaderEl = document.querySelector('.modal-header');
        const modalFooterEl = document.querySelector('.modal-footer');
        if (modalHeaderEl) {
            modalHeaderEl.addEventListener('click', (e) => {
                e.stopPropagation();
                showPlayerUI(2500);
            });
            modalHeaderEl.addEventListener('touchstart', (e) => {
                e.stopPropagation();
                showPlayerUI(2500);
            }, { passive: true });
        }
        if (modalFooterEl) {
            modalFooterEl.addEventListener('click', (e) => {
                e.stopPropagation();
                showPlayerUI(2500);
            });
            modalFooterEl.addEventListener('touchstart', (e) => {
                e.stopPropagation();
                showPlayerUI(2500);
            }, { passive: true });
        }

        function toggleFullscreen() {
            const modalContent = document.querySelector('.modal-content');
            const isCurrentlyFs = document.fullscreenElement === modalContent || modalContent.classList.contains('is-fullscreen');

            if (!isCurrentlyFs) {
                modalContent.classList.add('is-fullscreen');
                videoA.controls = false;
                videoB.controls = false;
                if (modalContent.requestFullscreen) {
                    modalContent.requestFullscreen().catch(() => {});
                }
                updateFullscreenButton(true);
                hidePlayerUI();
            } else {
                modalContent.classList.remove('is-fullscreen');
                videoA.controls = true;
                videoB.controls = true;
                if (document.fullscreenElement && document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                }
                updateFullscreenButton(false);
                hidePlayerUI();
            }
        }

        function updateFullscreenButton(forceState) {
            const modalContent = document.querySelector('.modal-content');
            const isFs = (typeof forceState === 'boolean') ? forceState : (document.fullscreenElement === modalContent || modalContent.classList.contains('is-fullscreen'));
            const btnFs = document.getElementById('btnFullscreen');
            const btnFsHeader = document.getElementById('btnFullscreenHeader');
            if (btnFs) {
                btnFs.innerHTML = isFs ? '⛶ Keluar Fullscreen' : '⛶ Layar Penuh';
                btnFs.title = isFs ? 'Keluar dari Layar Penuh' : 'Masuk ke Layar Penuh';
            }
            if (btnFsHeader) {
                btnFsHeader.innerHTML = isFs ? '🗗' : '⛶';
                btnFsHeader.title = isFs ? 'Keluar dari Layar Penuh' : 'Layar Penuh';
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const fsEl = document.fullscreenElement;
            const modalContent = document.querySelector('.modal-content');

            if (fsEl === videoA || fsEl === videoB) {
                document.exitFullscreen().then(() => {
                    if (modalContent && modalContent.requestFullscreen) {
                        modalContent.requestFullscreen().catch(() => {});
                    }
                }).catch(() => {});
                return;
            }

            if (fsEl === modalContent) {
                modalContent.classList.add('is-fullscreen');
                videoA.controls = false;
                videoB.controls = false;
                updateFullscreenButton(true);
                hidePlayerUI();
            } else {
                modalContent.classList.remove('is-fullscreen');
                videoA.controls = true;
                videoB.controls = true;
                updateFullscreenButton(false);
                hidePlayerUI();
            }
        });

        // Global & Modal Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            const activeTag = document.activeElement ? document.activeElement.tagName : '';
            if (['INPUT', 'SELECT', 'TEXTAREA'].includes(activeTag)) {
                if (e.key === 'Escape') {
                    document.activeElement.blur();
                }
                return;
            }

            // 'F' shortcut: Toggle Fullscreen
            if (e.key === 'f' || e.key === 'F') {
                if (modal.classList.contains('active')) {
                    e.preventDefault();
                    toggleFullscreen();
                    return;
                }
            }

            // 'H' shortcut: Toggle Clean Video Mode (Hide UI) in Fullscreen
            if (e.key === 'h' || e.key === 'H') {
                if (modal.classList.contains('active')) {
                    e.preventDefault();
                    toggleFsCleanMode();
                    return;
                }
            }

            // 'L' shortcut: Toggle Loop 1 Video
            if (e.key === 'l' || e.key === 'L') {
                if (modal.classList.contains('active')) {
                    e.preventDefault();
                    const loopCheck = document.getElementById('loopCheck');
                    if (loopCheck) {
                        loopCheck.checked = !loopCheck.checked;
                        onLoopToggle();
                        showPlayerToast(loopCheck.checked ? "🔁 Loop 1 Video: Aktif" : "🔁 Loop 1 Video: Nonaktif");
                    }
                    return;
                }
            }

            // 'R' shortcut: Play Random Video
            if (e.key === 'r' || e.key === 'R') {
                showPlayerToast("🎲 Memutar video acak...");
                playRandomVideo();
                return;
            }

            // 'J' shortcut: Focus Jump to number box
            if (e.key === 'j' || e.key === 'J') {
                e.preventDefault();
                const jumpInput = document.getElementById('jumpInput');
                if (jumpInput) {
                    jumpInput.focus();
                    jumpInput.select();
                }
                return;
            }

            if (!modal.classList.contains('active')) return;

            if (e.key === 'Escape') {
                closeModal();
            } else if (e.key === 'ArrowRight') {
                navigateVideo(1);
            } else if (e.key === 'ArrowLeft') {
                navigateVideo(-1);
            } else if (e.key === ' ') {
                e.preventDefault();
                if (activeVideo.paused) activeVideo.play();
                else activeVideo.pause();
            }
        });
    </script>
</body>
</html>
